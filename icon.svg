<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Central Badge -->
  <circle cx="256" cy="256" r="170" fill="url(#gold)" filter="url(#shadow)"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#451a03" stroke-width="6" stroke-dasharray="16 10"/>
  <!-- Number 9 (Salapan) -->
  <text x="256" y="325" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="210" font-weight="900" fill="#1e1b4b" text-anchor="middle">9</text>
  <!-- Coffee Bean / Text Subtitle -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="6">SALAPAN</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="3">COFFEE &amp; EATERY</text>
</svg>
